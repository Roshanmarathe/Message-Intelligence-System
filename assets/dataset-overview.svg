<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d" font-family="'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Dataset overview</title>
  <desc id="d">Class distribution: 4,227 legitimate messages (81.29 percent) versus 973 spam messages (18.71 percent). Missing values: sender_activity_score 106, sender_account_age_days 113, messages_sent_last_24h 162.</desc>
  <defs>
    <linearGradient id="gLegit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="gSpam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="gMiss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="24" fill="#0b1020"/>
  <rect x="30" y="24" width="570" height="312" rx="18" fill="#111833" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="640" y="24" width="530" height="312" rx="18" fill="#111833" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- LEFT: class distribution -->
  <text x="60" y="64" font-size="13" font-weight="700" letter-spacing="2" fill="#818cf8">CLASS DISTRIBUTION</text>
  <text x="60" y="86" font-size="14" fill="#94a3b8">5,200 labelled messages</text>

  <text x="60" y="128" font-size="14" font-weight="600" fill="#e2e8f0">Legitimate  ·  spam_label = 0</text>
  <rect x="60" y="140" width="400" height="30" rx="8" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="60" y="140" width="325.16" height="30" rx="8" fill="url(#gLegit)">
    <animate attributeName="width" values="0;325.16;325.16;0" keyTimes="0;0.2;0.88;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <text x="400" y="161" font-size="15" font-weight="700" fill="#6ee7b7">4,227  ·  81.29%</text>

  <text x="60" y="206" font-size="14" font-weight="600" fill="#e2e8f0">Spam  ·  spam_label = 1</text>
  <rect x="60" y="218" width="400" height="30" rx="8" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="60" y="218" width="74.84" height="30" rx="8" fill="url(#gSpam)">
    <animate attributeName="width" values="0;74.84;74.84;0" keyTimes="0;0.2;0.88;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <text x="149" y="239" font-size="15" font-weight="700" fill="#fda4af">973  ·  18.71%</text>

  <text x="60" y="290" font-size="20" font-weight="800" fill="#ffffff">Imbalance ≈ 4.34 : 1</text>
  <text x="60" y="312" font-size="13" fill="#94a3b8">Accuracy alone can mislead — read precision, recall and F1.</text>

  <!-- RIGHT: missing values -->
  <text x="670" y="64" font-size="13" font-weight="700" letter-spacing="2" fill="#818cf8">MISSING VALUES</text>
  <text x="670" y="86" font-size="14" fill="#94a3b8">Median-imputed inside the pipeline</text>

  <text x="670" y="124" font-size="13" font-weight="600" fill="#e2e8f0" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">sender_activity_score</text>
  <rect x="670" y="134" width="300" height="22" rx="6" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="670" y="134" width="196.3" height="22" rx="6" fill="url(#gMiss)">
    <animate attributeName="width" values="0;196.3;196.3;0" keyTimes="0;0.2;0.88;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <text x="982" y="151" font-size="14" font-weight="700" fill="#a5b4fc">106  ·  2.04%</text>

  <text x="670" y="186" font-size="13" font-weight="600" fill="#e2e8f0" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">sender_account_age_days</text>
  <rect x="670" y="196" width="300" height="22" rx="6" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="670" y="196" width="209.3" height="22" rx="6" fill="url(#gMiss)">
    <animate attributeName="width" values="0;209.3;209.3;0" keyTimes="0;0.25;0.88;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <text x="982" y="213" font-size="14" font-weight="700" fill="#a5b4fc">113  ·  2.17%</text>

  <text x="670" y="248" font-size="13" font-weight="600" fill="#e2e8f0" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">messages_sent_last_24h</text>
  <rect x="670" y="258" width="300" height="22" rx="6" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="670" y="258" width="300" height="22" rx="6" fill="url(#gMiss)">
    <animate attributeName="width" values="0;300;300;0" keyTimes="0;0.3;0.88;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <text x="982" y="275" font-size="14" font-weight="700" fill="#a5b4fc">162  ·  3.12%</text>
</svg>
