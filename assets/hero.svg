<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d" font-family="'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Message Intelligence System</title>
  <desc id="d">Animated banner: spam versus legitimate message classification using KNN, SVM and Naive Bayes, with a scanning beam and two floating message cards labelled LEGIT and SPAM.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="0.55" stop-color="#101638"/>
      <stop offset="1" stop-color="#1b0f3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="400" rx="24"/></clipPath>
    <clipPath id="type">
      <rect x="70" y="212" width="0" height="40">
        <animate attributeName="width" values="0;640;640;0" keyTimes="0;0.35;0.9;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>

    <!-- ambient orbs -->
    <circle cx="170" cy="60" r="130" fill="#22d3ee" fill-opacity="0.07">
      <animate attributeName="cy" values="60;100;60" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="340" r="170" fill="#f472b6" fill-opacity="0.07">
      <animate attributeName="cy" values="340;300;340" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="40" r="90" fill="#818cf8" fill-opacity="0.08">
      <animate attributeName="r" values="90;120;90" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- title -->
    <text x="70" y="140" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-1">Message Intelligence</text>
    <text x="70" y="198" font-size="54" font-weight="800" fill="url(#accent)" letter-spacing="-1">System</text>

    <!-- typed subtitle -->
    <g clip-path="url(#type)">
      <text x="70" y="240" font-size="22" fill="#c7d2fe">Spam vs Legitimate Message Classification</text>
    </g>

    <!-- model chips -->
    <g font-size="14" font-weight="600" text-anchor="middle">
      <rect x="70" y="262" width="74" height="32" rx="16" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.6"/>
      <text x="107" y="283" fill="#67e8f9">KNN</text>
      <rect x="156" y="262" width="74" height="32" rx="16" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.6"/>
      <text x="193" y="283" fill="#a5b4fc">SVM</text>
      <rect x="242" y="262" width="132" height="32" rx="16" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.6"/>
      <text x="308" y="283" fill="#f9a8d4">Naive Bayes</text>
      <rect x="386" y="262" width="112" height="32" rx="16" fill="#fb7185" fill-opacity="0.12" stroke="#fb7185" stroke-opacity="0.6"/>
      <text x="442" y="283" fill="#fda4af">Streamlit</text>
    </g>

    <!-- status line -->
    <circle cx="78" cy="336" r="5" fill="#34d399" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="94" y="341" font-size="15" fill="#94a3b8">5,200 messages  ·  12 engineered features  ·  4 classifiers  ·  80/20 stratified split</text>

    <!-- legit card -->
    <g transform="translate(800,70)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="4s" repeatCount="indefinite"/>
        <rect width="300" height="96" rx="16" fill="#0f1a2e" stroke="#34d399" stroke-width="1.5"/>
        <circle cx="44" cy="48" r="22" fill="#34d399" fill-opacity="0.15"/>
        <path d="M33 48 l8 8 l15 -17" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="84" y="24" width="150" height="10" rx="5" fill="#ffffff" fill-opacity="0.5"/>
        <rect x="84" y="44" width="190" height="8" rx="4" fill="#ffffff" fill-opacity="0.22"/>
        <rect x="84" y="62" width="96" height="22" rx="11" fill="#34d399" fill-opacity="0.18"/>
        <text x="132" y="78" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">LEGIT · 0</text>
      </g>
    </g>

    <!-- spam card -->
    <g transform="translate(850,210)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="4.6s" repeatCount="indefinite"/>
        <rect width="300" height="96" rx="16" fill="#2a1020" stroke="#fb7185" stroke-width="1.5"/>
        <circle cx="44" cy="48" r="22" fill="#fb7185" fill-opacity="0.15">
          <animate attributeName="r" values="22;28;22" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="fill-opacity" values="0.15;0.02;0.15" dur="2s" repeatCount="indefinite"/>
        </circle>
        <path d="M44 32 L61 62 L27 62 Z" fill="none" stroke="#fb7185" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M44 42 V52" stroke="#fb7185" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="44" cy="57.5" r="1.8" fill="#fb7185"/>
        <rect x="84" y="24" width="170" height="10" rx="5" fill="#ffffff" fill-opacity="0.5"/>
        <rect x="84" y="44" width="120" height="8" rx="4" fill="#ffffff" fill-opacity="0.22"/>
        <rect x="84" y="62" width="96" height="22" rx="11" fill="#fb7185" fill-opacity="0.18"/>
        <text x="132" y="78" font-size="12" font-weight="700" fill="#fb7185" text-anchor="middle">SPAM · 1</text>
      </g>
    </g>

    <!-- scanning beam -->
    <rect y="0" width="220" height="400" fill="url(#beam)">
      <animate attributeName="x" values="-220;1200" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="1198" height="398" rx="24" fill="none" stroke="url(#accent)" stroke-opacity="0.6" stroke-width="2"/>
</svg>
