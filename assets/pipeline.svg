<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d" font-family="'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">End-to-end pipeline</title>
  <desc id="d">Animated flow: dataset, stratified 80:20 split, preprocessing, training four classifiers, evaluation, and deployment as a Streamlit app. A glowing packet travels along the pipeline.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="#0b1020"/>
  <text x="600" y="48" font-size="13" font-weight="700" letter-spacing="3" fill="#818cf8" text-anchor="middle">END-TO-END PIPELINE</text>

  <!-- flowing baseline -->
  <line x1="30" y1="155" x2="1165" y2="155" stroke="url(#line)" stroke-width="3" stroke-dasharray="10 8" stroke-opacity="0.75">
    <animate attributeName="stroke-dashoffset" values="36;0" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- nodes -->
  <g text-anchor="middle">
    <!-- 1 -->
    <rect x="30" y="100" width="160" height="110" rx="16" fill="#0f1530" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35;0.35" keyTimes="0;0.07;0.14;1" dur="8.4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="110" cy="128" r="15" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee"/>
    <text x="110" y="133" font-size="14" font-weight="700" fill="#67e8f9">1</text>
    <text x="110" y="172" font-size="16" font-weight="700" fill="#ffffff">Dataset</text>
    <text x="110" y="192" font-size="11.5" fill="#9aa4c7">5,200 rows · 16 cols</text>
    <text x="110" y="207" font-size="11.5" fill="#9aa4c7">target: spam_label</text>

    <!-- 2 -->
    <rect x="225" y="100" width="160" height="110" rx="16" fill="#0f1530" stroke="#818cf8" stroke-width="2" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35;0.35" keyTimes="0;0.24;0.31;1" dur="8.4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="305" cy="128" r="15" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8"/>
    <text x="305" y="133" font-size="14" font-weight="700" fill="#a5b4fc">2</text>
    <text x="305" y="172" font-size="16" font-weight="700" fill="#ffffff">Split</text>
    <text x="305" y="192" font-size="11.5" fill="#9aa4c7">80 : 20 stratified</text>
    <text x="305" y="207" font-size="11.5" fill="#9aa4c7">fixed random_state</text>

    <!-- 3 -->
    <rect x="420" y="100" width="160" height="110" rx="16" fill="#0f1530" stroke="#a78bfa" stroke-width="2" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35;0.35" keyTimes="0;0.41;0.48;1" dur="8.4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="500" cy="128" r="15" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa"/>
    <text x="500" y="133" font-size="14" font-weight="700" fill="#c4b5fd">3</text>
    <text x="500" y="172" font-size="16" font-weight="700" fill="#ffffff">Preprocess</text>
    <text x="500" y="192" font-size="11.5" fill="#9aa4c7">median imputation</text>
    <text x="500" y="207" font-size="11.5" fill="#9aa4c7">scaling (KNN, SVM)</text>

    <!-- 4 -->
    <rect x="615" y="100" width="160" height="110" rx="16" fill="#0f1530" stroke="#f472b6" stroke-width="2" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35;0.35" keyTimes="0;0.59;0.66;1" dur="8.4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="695" cy="128" r="15" fill="#f472b6" fill-opacity="0.15" stroke="#f472b6"/>
    <text x="695" y="133" font-size="14" font-weight="700" fill="#f9a8d4">4</text>
    <text x="695" y="172" font-size="16" font-weight="700" fill="#ffffff">Train</text>
    <text x="695" y="192" font-size="11.5" fill="#9aa4c7">KNN · Linear SVM</text>
    <text x="695" y="207" font-size="11.5" fill="#9aa4c7">RBF SVM · Gaussian NB</text>

    <!-- 5 -->
    <rect x="810" y="100" width="160" height="110" rx="16" fill="#0f1530" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35;0.35" keyTimes="0;0.76;0.83;1" dur="8.4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="890" cy="128" r="15" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24"/>
    <text x="890" y="133" font-size="14" font-weight="700" fill="#fcd34d">5</text>
    <text x="890" y="172" font-size="16" font-weight="700" fill="#ffffff">Evaluate</text>
    <text x="890" y="192" font-size="11.5" fill="#9aa4c7">Acc · Prec · Rec · F1</text>
    <text x="890" y="207" font-size="11.5" fill="#9aa4c7">confusion matrices</text>

    <!-- 6 -->
    <rect x="1005" y="100" width="160" height="110" rx="16" fill="#0f1530" stroke="#34d399" stroke-width="2" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35;0.35" keyTimes="0;0.93;0.995;1" dur="8.4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="1085" cy="128" r="15" fill="#34d399" fill-opacity="0.15" stroke="#34d399"/>
    <text x="1085" y="133" font-size="14" font-weight="700" fill="#6ee7b7">6</text>
    <text x="1085" y="172" font-size="16" font-weight="700" fill="#ffffff">Deploy</text>
    <text x="1085" y="192" font-size="11.5" fill="#9aa4c7">best_spam_model.joblib</text>
    <text x="1085" y="207" font-size="11.5" fill="#9aa4c7">Streamlit app</text>
  </g>

  <!-- travelling packet -->
  <g filter="url(#glow)">
    <circle r="7" fill="#ffffff">
      <animateMotion path="M30 155 H1165" dur="8.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="600" y="262" font-size="13" fill="#64748b" text-anchor="middle">Preprocessing lives inside scikit-learn Pipelines — the same steps run at training time and at prediction time.</text>
</svg>
